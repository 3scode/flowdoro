services:
  postgres:
    image: postgres:16-alpine
    container_name: flowdoro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowdoro
      POSTGRES_PASSWORD: flowdoro
      POSTGRES_DB: flowdoro
    ports:
      - "5432:5432"
    volumes:
      - flowdoro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdoro -d flowdoro"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    container_name: flowdoro-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://flowdoro:flowdoro@postgres:5432/flowdoro
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules

volumes:
  flowdoro_pgdata:

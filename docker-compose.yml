services:
  api:
    build:
      context: ./apps/api
    container_name: flowdoro-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # Local uses 3000; Hugging Face Spaces overrides to 7860 via Space Variables
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./apps/api:/app
      - /app/node_modules

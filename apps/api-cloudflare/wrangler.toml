name = "flowdoro-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "flowdoro-auth"
database_id = "e0f8f3e4-1755-48fe-9758-25e476ee5504"

[vars]
NODE_ENV = "production"
APP_URL = "https://flowdoro.3scode.my.id"
CORS_ORIGIN = "https://flowdoro.3scode.my.id"
API_URL = ""
REST_RATIO_DEFAULT = "5"
LOG_LEVEL = "info"
APPWRITE_ENDPOINT = "https://sgp.cloud.appwrite.io/v1"
APPWRITE_PROJECT_ID = "6a97cfd7002c5462242e"
APPWRITE_DATABASE_ID = "6a97dd7e002e7e71c54c"
APPWRITE_COLLECTION_PROFILES = "profiles"
APPWRITE_COLLECTION_TASKS = "tasks"
APPWRITE_COLLECTION_SESSIONS = "sessions"
APPWRITE_COLLECTION_EVENTS = "session_events"
APPWRITE_COLLECTION_LISTS = "lists"
APPWRITE_COLLECTION_GOOGLE_TOKENS = "google_tokens"
APPWRITE_BUCKET_AVATARS = "avatars"
GOOGLE_CLIENT_ID = "your-google-client-id.apps.googleusercontent.com" # set real value via dashboard or wrangler vars — don't commit real ID
GOOGLE_REDIRECT_URI = "https://api.flowdoro.3scode.my.id/api/google/callback"
BETTER_AUTH_URL = "https://api.flowdoro.3scode.my.id"
# BETTER_AUTH_SECRET, APPWRITE_API_KEY, GOOGLE_CLIENT_SECRET, GOOGLE_TOKEN_ENCRYPTION_KEY, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET must be set via `wrangler secret put` — never commit here
